name: CI

on:
  push:
    branches: ['**']        # every branch (it used to be main only, so work on other branches was never checked)
  pull_request:

# a newer push to the same branch or pull request cancels the run that is still going
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (loose config for the whole app, strict config for the game core)
        run: npm run typecheck
      - name: Unit tests (fairness maths, odds, wallet rules, verifier)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

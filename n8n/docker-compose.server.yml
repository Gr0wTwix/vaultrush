# n8n on a small always-on server (a VPS) with its own domain and automatic https. NOT tested here (it needs a real server and domain); the PC version is.
#
# Before you start: point a DNS name (e.g. n8n.example.com) at the server's IP, open ports 80 and 443, install Docker.
# Copy .env.example to .env and set N8N_ENCRYPTION_KEY and GENERIC_TIMEZONE; also add:  N8N_DOMAIN=n8n.example.com
# Then:  docker compose -f docker-compose.server.yml up -d
# IMPORTANT: open https://<your domain> at once and create the owner account, because until you do, anybody who finds the address could.
name: vaultrush-n8n-server

services:
  n8n:
    image: n8nio/n8n:2.48.7
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
    volumes:
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  n8n_data:
  caddy_data:

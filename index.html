<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaultrush — Play-money skin games</title>
  <meta name="description" content="Play-money CS2 skin games: cases, battles, upgrade, crash and more. Coins have no cash value and cannot be bought or withdrawn.">
  <meta name="theme-color" content="#090d15">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <!-- Link previews. The site address in these tags is filled in at build time from the host's production address
       (vite.config.ts); a build without one drops the tags that need a full address. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vaultrush">
  <meta property="og:title" content="Vaultrush — Play-money skin games">
  <meta property="og:description" content="Cases, battles, upgrade, crash and more with play coins. No real money.">
  <meta property="og:url" content="__SITE_ORIGIN__/">
  <meta property="og:image" content="__SITE_ORIGIN__/brand/social-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vaultrush, play-money skin arena">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="__SITE_ORIGIN__/brand/social-card.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Loading screen: styled here so it shows before the site's own files arrive. src/splash.ts removes it once the first page is drawn;
       if no script ever runs, it fades out by itself after 12 seconds. -->
  <style>
    html, body { background: #090d15; margin: 0; }
    .splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(ellipse at 50% 42%, #14203a 0%, #0d1320 32%, #090d15 70%); color: #e8edf7;
      font-family: 'Oxanium', 'Inter', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s;
      animation: splash-fallback .45s ease 12s forwards; }
    .splash.out { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-in { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: splash-rise .5s ease-out both; }
    .splash-dial { position: relative; width: 136px; height: 136px; }
    .splash-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .splash-ticks { animation: splash-spin 10s linear infinite; }
    .splash-arc { animation: splash-spin 1.1s cubic-bezier(.55, .2, .45, .8) infinite; }
    .splash-mark { position: absolute; inset: 0; margin: auto; width: 60px; height: 60px; border-radius: 16px; background: #101625; border: 1.5px solid rgba(198, 255, 61, .45);
      display: grid; place-items: center; animation: splash-pulse 1.6s ease-in-out infinite; }
    .splash-mark svg { position: static; width: 38px; height: 38px; fill: #cbfa3d; }
    .splash-word { display: block; width: 170px; height: auto; }
    .splash-text { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .splash-text strong { font-size: 13px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; padding-left: .34em; }
    .splash-text span { font: 500 12px 'Inter', system-ui, sans-serif; color: #8592ab; letter-spacing: .04em; }
    .splash-bar { width: 200px; max-width: 70vw; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, transparent, #c6ff3d);
      animation: splash-bar 1.3s ease-in-out infinite; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-pulse { 0%, 100% { box-shadow: 0 0 18px rgba(198, 255, 61, .25); transform: scale(1); }
      50% { box-shadow: 0 0 40px rgba(198, 255, 61, .55); transform: scale(1.06); } }
    @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes splash-fallback { to { opacity: 0; visibility: hidden; } }
    @media (min-width: 900px) {
      .splash-in { transform: scale(1.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-in, .splash-ticks, .splash-arc, .splash-mark, .splash-bar i { animation: none; }
      .splash-bar i { width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash-in">
      <div class="splash-dial" aria-hidden="true">
        <svg viewBox="0 0 136 136"><circle cx="68" cy="68" r="62" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="4"/></svg>
        <svg class="splash-ticks" viewBox="0 0 136 136"><circle cx="68" cy="68" r="49" fill="none" stroke="rgba(198,255,61,.32)" stroke-width="6" stroke-dasharray="1.6 6.95"/></svg>
        <svg class="splash-arc" viewBox="0 0 136 136"><circle cx="68" cy="68" r="62" fill="none" stroke="#c6ff3d" stroke-width="4" stroke-linecap="round" stroke-dasharray="96 294"/></svg>
        <span class="splash-mark"><svg viewBox="0 0 64 64"><path fill-rule="evenodd" d="M2 9 20 14 28 28 23 26 32 39 42 24 37 27 46 12 63 6 33 58 30 58Z"/></svg></span>
      </div>
      <img class="splash-word" src="brand/wordmark-dark.svg" alt="" width="170" height="40" aria-hidden="true">
      <div class="splash-text"><strong>Loading</strong><span>Opening the vault…</span></div>
      <div class="splash-bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <div class="app" aria-busy="true">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="ticker" id="ticker"><div class="ticker-label"><span class="live-dot"></span>Live drops</div><div class="ticker-track" id="tickerTrack"></div></div>
      <main id="view" class="view"></main>
      <footer class="footer" id="footer"></footer>
    </div>
    <aside class="chat" id="chat"></aside>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>

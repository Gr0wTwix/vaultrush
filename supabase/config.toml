# Minimal CLI config so `supabase functions deploy` knows how to treat each function.
project_id = "vaultrush"

# Steam redirects the browser here, so there is no Supabase JWT to check. The function verifies the Steam assertion itself.
[functions.steam-login]
verify_jwt = false

# Called by a signed-in player: Supabase checks the JWT, and the function checks it again.
[functions.close-login]
verify_jwt = true
